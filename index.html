<style>
  :root{
    --paper:#F6F6F3; --card:#FFFFFF; --ink:#16181D; --mute:#6B7178; --faint:#9AA0A6;
    --line:#E4E5E0; --line2:#EFEFEA; --gold:#FFD100; --goldink:#14181F;
    --r:8px; --col:780px;
    --serif:"Newsreader",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}

  header.mast{background:#16181D;color:#fff}
  .mast-in{max-width:var(--col);margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1}
  .brand em{font-style:italic;color:var(--gold)}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .links{display:flex;gap:8px}
  .signin{font-size:13px;font-weight:600;color:#fff;border:1px solid #4A505A;padding:3px 11px;border-radius:999px;text-decoration:none}
  .tvlink{font-size:13px;font-weight:600;color:var(--ink);background:var(--gold);padding:4px 11px;border-radius:999px;text-decoration:none}
  .dateline{font-size:12px;color:#AEB4BB;letter-spacing:.08em;text-transform:uppercase;padding-bottom:3px;text-align:right}

  main{max-width:var(--col);margin:0 auto;padding:0 20px 64px}
  .tools{display:flex;gap:10px;align-items:center;padding:16px 0 4px}
  .tools input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;font-size:15px;color:inherit}
  .tools input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,24,29,.08)}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
  .seg button{font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;color:var(--mute)}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff}
  .count{font-size:13px;color:var(--mute);white-space:nowrap}
  .empty{padding:64px 20px;text-align:center;color:var(--mute)}
  .empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:500}

  .story{border-bottom:1px solid var(--line);padding:18px 0}
  .story .row{display:flex;gap:14px;align-items:flex-start}
  .story .body{flex:1;min-width:0}
  .story .side{flex:none}
  .story .top{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px;color:var(--mute);flex-wrap:wrap}
  .story .top .src{font-weight:600;color:var(--ink)}
  .ha{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px;color:var(--mute)}
  .ha .dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .ha.h5 .dot,.ha.h4 .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(255,209,0,.25)}
  .ha.h5,.ha.h4{color:var(--ink)}
  .ha.h3 .dot{background:var(--faint)}
  .type-tag{font-size:12px;font-weight:600;color:var(--ink);background:var(--line2);padding:2px 8px;border-radius:5px;text-transform:capitalize}
  .story h3{margin:0;font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.25;letter-spacing:-.005em}
  .story .note{margin-top:6px;color:var(--mute);font-size:15px}
  .story .drawer{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .story.open .drawer{max-height:1400px}
  .more{font-size:12px;font-weight:600;color:var(--ink);background:var(--line2);padding:1px 9px;border-radius:999px;border:0;cursor:pointer}
  .more:after{content:" ▾"} .story.open .more:after{content:" ▴"}
  @media (max-width:520px){.story .row{flex-direction:column}.story .side .btn{width:100%}}
  .also{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2)}
  .alsoh{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
  .also a{display:block;font-size:14px;color:var(--ink);padding:5px 0;text-decoration:none;line-height:1.35}
  .also a:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){.story .drawer{transition:none}}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--mute)}
  .btn:active{transform:translateY(1px)}
  .foot{padding:28px 0 0;font-size:13px;color:var(--faint)}
  .load{padding:48px 0;text-align:center;color:var(--mute)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* Dark theme, used by embeds: ?theme=dark or ?theme=auto */
  html[data-theme=dark]{--paper:#16181D;--card:#20242B;--ink:#F2F2EE;--mute:#A4AAB1;--faint:#7C838B;--line:#323741;--line2:#2A2E36}
  html[data-theme=dark] .seg button[aria-pressed=true]{color:#16181D}
  html[data-theme=dark] .tools input:focus{box-shadow:0 0 0 3px rgba(242,242,238,.12)}

  /* Embed mode: ?embed=1 */
  .ebar{display:none}
  html.embed header.mast{display:none}
  html.embed .ebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px 10px;border-bottom:2px solid var(--ink)}
  html.embed .ebar .brand{font-size:20px}
  html.embed.nohead .ebar{display:none}
  html.embed .ebar a{font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
  html.embed .ebar a:hover{color:var(--ink);text-decoration:underline}
  html.embed main{padding:0 14px 8px;max-width:none}
  html.embed .tools{padding:12px 0 2px}
  html.embed.nocontrols .tools{display:none}
  html.embed .story{padding:14px 0}
  html.embed .story h3{font-size:19px}
  html.embed .story:last-child{border-bottom:0}
  html.embed .foot{padding:14px 0 0;font-size:12px}
  html.embed .foot a{font-weight:600;text-decoration:none}
  html.embed.nocredit .foot{display:none}

<script>
// Groups near-duplicate stories. Returns [{lead, others:[...]}] in the order of each lead's first appearance.
function groupStories(items){
  const STOP = new Set(("the a an and or of to in on for with from by at as is are was were be been it its this that these those after over into about out up down off new says say said could would should will may might can has have had not but than then their there they them his her your you our we us what when who why how more most also just now one two three first second under between amid against across during before while via per vs " +
    "zero day days hits fixes fix fixed critical flaw flaws vulnerability vulnerabilities security cyber cybersecurity attack attacks attacker attackers hackers hacker hacked hack patch patches patched update updates warns warning urges urged finds found users user hit lets let allow allows allowed bug bugs data breach exploit exploited exploitation exploits report reports reported leak leaked ransomware malware campaign threat threats released release releases supply chain global network networks detection business company companies tech").split(" "));
  const clean = t => t.replace(/&#?\w+;/g," ").replace(/’|‘|'/g,"");
  const toks = t => {
    const out = [];
    clean(t).replace(/(\d),(\d)/g,"$1$2").split(/[^A-Za-z0-9]+/).forEach(w => {
      if (!w) return;
      const low = w.toLowerCase();
      if (STOP.has(low)) return;
      const hasDigit = /\d/.test(w);
      if (!hasDigit && low.length < 3) return;
      let k = low; if (!hasDigit && k.length > 4 && k.endsWith("s") && !k.endsWith("ss")) k = k.slice(0,-1);
      const camel = /[a-z][A-Z]/.test(w) || (/[A-Za-z]/.test(w) && hasDigit && w.length >= 5);
      const numKey = !/[A-Za-z]/.test(w) && w.length >= 4 && !/^20[2-3]\d$/.test(w);   // years are not a story key
      out.push({ k, key: camel || numKey });
    });
    return out;
  };
  const docs = items.map(i => {
    const title = i.title.replace(/\s+-\s+[^-]{2,60}$/, "");
    const map = new Map(); toks(title).forEach(t => { if (!map.has(t.k)) map.set(t.k, t.key); });
    return map;
  });
  const df = new Map(); docs.forEach(m => m.forEach((_, k) => df.set(k, (df.get(k) || 0) + 1)));
  const N = items.length, idf = k => Math.log(N / df.get(k));
  const groups = [];
  const near = (a, b) => {
    let w = 0, n = 0, key = false, rare = 0;
    a.forEach((isKey, k) => { if (b.has(k)) { w += idf(k); n++; if (idf(k) >= 3.3) rare++; if (isKey && df.get(k) >= 2 && df.get(k) <= 30) key = true; } });
    return key || (n >= 3 && w >= 8 && rare >= 2) || (n >= 2 && rare >= 2 && w >= 7.5);
  };
  items.forEach((it, i) => {
    const t = new Date(it.published_at).getTime();
    for (const g of groups){
      if (Math.abs(t - g.t) > 72 * 3600 * 1000) continue;
      if (near(docs[g.seed], docs[i])){ g.others.push(it); return; }
    }
    groups.push({ lead: it, others: [], seed: i, t });
  });
  return groups.map(g => ({ lead: g.lead, others: g.others }));
}

if (EMBED){
  root.classList.add("embed");
  if (Q.get("head") === "0") root.classList.add("nohead");
  if (Q.get("controls") === "0") root.classList.add("nocontrols");
  if (Q.get("credit") === "0") root.classList.add("nocredit");
  const foot = document.getElementById("foot"), home = new URL("./", location.href).href;
  foot.replaceChildren(document.createTextNode("Powered by "), Object.assign(document.createElement("a"), { href: home, target: "_blank", rel: "noopener", textContent: "ISAW News" }));
  document.getElementById("fullwire").href = home;
}
{
  let th = (Q.get("theme") || "").toLowerCase();
  if (th === "auto") th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  if (th === "dark" || th === "light") root.dataset.theme = th;
  const hex = v => /^[0-9a-f]{3}$|^[0-9a-f]{6}$/i.test(v || "") ? "#" + v : null;
  const acc = hex(Q.get("accent")); if (acc) root.style.setProperty("--gold", acc);
  const bg = Q.get("bg");
  if (bg === "transparent") root.style.setProperty("--paper", "transparent");
  else if (hex(bg)) root.style.setProperty("--paper", hex(bg));
}
const qRegion = (Q.get("region") || "").toLowerCase();
if (["all","uk","us"].includes(qRegion)) region = qRegion;
else if (!EMBED) { try { const r = localStorage.getItem("isaw-region"); if (["all","uk","us"].includes(r)) region = r; } catch {} }

// Tell the page that embeds us how tall we are, so it can size the frame (embed.js listens for this).
function postHeight(){ if (!EMBED || parent === window) return; parent.postMessage({ isaw:"embed-height", id:Q.get("id") || "", height:Math.ceil(document.body.getBoundingClientRect().height) }, "*"); }
if (EMBED && window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
function syncRegion(){ document.querySelectorAll("#region button").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === region)); }

$("#dateline").textContent = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

function tidy(r){
  if (/^GN:/.test(r.source_name || "")){
    const m = r.title.match(/^(.*\S)\s+-\s+([^-]{2,40})$/);
    if (m){ r.title = m[1]; r.source_name = m[2]; } else r.source_name = "Google News";
  }
  r.summary = (r.summary || "").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
  if (r.summary.toLowerCase().startsWith(r.title.toLowerCase().slice(0,40))) r.summary = "";   // Google News repeats the headline as the summary
  return r;
}
function ago(d){
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 2) return "now"; if (m < 60) return m + "m";
  const h = Math.round(m / 60); if (h < 24) return h + "h";
  return Math.round(h / 24) + "d";
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch { return "#"; } }

async function load(){
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/public_wire_v2", {
      method:"POST",
      headers:{ apikey:ANON, Authorization:"Bearer " + ANON, "Content-Type":"application/json" },
      body: JSON.stringify({ max_age_hours:HOURS, max_items:150 })
    });
    if (!r.ok) throw new Error(r.status);
    items = (await r.json()).map(tidy); loaded = true;
    render();
  } catch {
    if (!loaded) $("#list").replaceChildren(Object.assign(el("div","empty"),{innerHTML:"<b>The wire didn't load</b>Check your connection and refresh the page."}));
  }
}

function render(){
  const term = $("#q").value.trim().toLowerCase();
  let list = region === "all" ? items : items.filter(i => i.region === region);
  if (MINSCORE) list = list.filter(i => (i.human_angle || 0) >= MINSCORE);
  if (term) list = list.filter(i => `${i.title} ${i.summary} ${i.source_name}`.toLowerCase().includes(term));
  const groups = groupStories(list).slice(0, LIMIT || undefined);
  $("#count").textContent = groups.length + (groups.length === 1 ? " story" : " stories");
  const box = $("#list"); box.replaceChildren();
  if (!list.length){
    const e = el("div","empty"); e.append(el("b","", term ? "No matches" : "The wire is clear"), document.createTextNode(term ? `Nothing matches "${term}".` : region !== "all" ? `No ${region.toUpperCase()} stories right now. Try All.` : "New stories arrive every few minutes."));
    box.appendChild(e); return;
  }
  const open = new Set([...document.querySelectorAll(".story.open")].map(x => x.dataset.id));
  groups.forEach(({ lead:i, others }) => {
    const a = el("article","story" + (others.length && open.has(i.id) ? " open" : "")); a.dataset.id = i.id;
    const row = el("div","row"), body = el("div","body"), side = el("div","side");
    const top = el("div","top");
    const h = i.human_angle;
    if (h){ const ha = el("span","ha h" + h); ha.append(el("span","dot"), document.createTextNode(h + "/5")); top.appendChild(ha); }
    if (i.story_type) top.appendChild(el("span","type-tag",i.story_type.replace(/_/g," ")));
    top.append(el("span","src",i.source_name || ""), el("span","",ago(i.published_at)));
    if (others.length){
      const m = el("button","more","+" + others.length + (others.length === 1 ? " more source" : " more sources"));
      m.setAttribute("aria-expanded", a.classList.contains("open")); m.dataset.toggle = "1"; top.appendChild(m);
    }
    body.append(top, el("h3","",i.title));
    const note = i.angle_note || (i.summary ? i.summary.slice(0,220) + (i.summary.length > 220 ? "…" : "") : "");
    if (note) body.appendChild(el("div","note",note));
    const link = el("a","btn","Open ↗"); link.href = safeUrl(i.url); link.target = "_blank"; link.rel = "noopener noreferrer";
    side.appendChild(link); row.append(body, side); a.appendChild(row);
    if (others.length){
      const d = el("div","drawer"), inn = el("div","inner"), box2 = el("div","also");
      box2.appendChild(el("div","alsoh","Also reported by"));
      others.forEach(o => { const l = el("a","", (o.source_name || "Source") + ": " + o.title); l.href = safeUrl(o.url); l.target = "_blank"; l.rel = "noopener noreferrer"; box2.appendChild(l); });
      inn.appendChild(box2); d.appendChild(inn); a.appendChild(d);
    }
    box.appendChild(a);
  });
}
$("#list").addEventListener("click", e => {
  const m = e.target.closest("[data-toggle]"); if (!m) return;
  const art = m.closest(".story"); m.setAttribute("aria-expanded", art.classList.toggle("open"));
});
$("#q").addEventListener("input", render);
$("#region").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; region = b.dataset.r; if (!EMBED) try { localStorage.setItem("isaw-region", region); } catch {} syncRegion(); render(); });
syncRegion();
load(); setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
